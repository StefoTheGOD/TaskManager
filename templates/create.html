
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task - TaskManager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link href="{{ url_for('static', filename='css/style.css') }}"
          rel="stylesheet">
</head>

<body>

<div class="container py-5">

    <div class="mb-4">
        <a href="{{ url_for('tasks.index') }}"
           class="text-decoration-none text-secondary">
            <i class="bi bi-arrow-left me-2"></i>
            Back to Workspace
        </a>
    </div>

    <div class="form-page mx-auto">

        <div class="mb-4">
            <div class="page-icon mb-3">
                <i class="bi bi-plus-lg"></i>
            </div>

            <h1>Create New Task</h1>
            <p class="page-subtitle">
                Add a new task to your study workspace.
            </p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">

                <form method="POST"
                      action="{{ url_for('tasks.create') }}">

                    <div class="mb-4">
                        <label for="title" class="form-label fw-semibold">
                            Task Title
                        </label>
                        <input type="text"
                               id="title"
                               name="title"
                               class="form-control"
                               placeholder="e.g. Complete Python assignment"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="subject" class="form-label fw-semibold">
                            Subject
                        </label>
                        <input type="text"
                               id="subject"
                               name="subject"
                               class="form-control"
                               placeholder="e.g. Software Technologies"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">
                            Description
                        </label>
                        <textarea id="description"
                                  name="description"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Add more details about your task..."></textarea>
                    </div>

                    <div class="row g-3 mb-4">

                        <div class="col-md-6">
                            <label for="deadline" class="form-label fw-semibold">
                                Deadline
                            </label>
                            <input type="date"
                                   id="deadline"
                                   name="deadline"
                                   class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label for="priority" class="form-label fw-semibold">
                                Priority
                            </label>
                            <select id="priority"
                                    name="priority"
                                    class="form-select">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">

                        <a href="{{ url_for('tasks.index') }}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            Create Task
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>

</div>

</body>
</html>
