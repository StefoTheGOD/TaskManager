<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Task - TaskManager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 650px;">

    <h1 class="mb-4">Delete Task</h1>

    <div class="card shadow-sm">
        <div class="card-body">

            <h4>Are you sure you want to delete this task?</h4>

            <p class="text-muted">
                This action cannot be undone.
            </p>

            <hr>

            <p><strong>Title:</strong> {{ task[1] }}</p>
            <p><strong>Subject:</strong> {{ task[2] }}</p>
            <p><strong>Deadline:</strong> {{ task[4] or 'Not set' }}</p>
            <p><strong>Priority:</strong> {{ task[5] }}</p>

            <form method="POST"
                  action="{{ url_for('tasks.delete', task_id=task[0]) }}">

                <div class="d-flex gap-2 mt-4">

                    <button type="submit" class="btn btn-danger">
                        Yes, Delete Task
                    </button>

                    <a href="{{ url_for('tasks.index') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
