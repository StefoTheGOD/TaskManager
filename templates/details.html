
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details - TaskManager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link href="{{ url_for('static', filename='css/style.css') }}"
          rel="stylesheet">
</head>

<body>

<div class="container py-5">

    <!-- Back Navigation -->
    <div class="mb-4">
        <a href="{{ url_for('tasks.index') }}"
           class="text-decoration-none text-secondary">
            <i class="bi bi-arrow-left me-2"></i>
            Back to Workspace
        </a>
    </div>

    <div class="form-page mx-auto">

        <!-- Header -->
        <div class="mb-4">
            <div class="page-icon mb-3">
                <i class="bi bi-eye"></i>
            </div>

            <h1>Task Details</h1>
            <p class="page-subtitle">
                View all information about your task.
            </p>
        </div>

        <!-- Details Card -->
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">

                <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                    <div>
                        <small class="text-muted">
                            TASK #{{ task[0] }}
                        </small>

                        <h3 class="fw-bold mt-2 mb-0">
                            {{ task[1] }}
                        </h3>
                    </div>

                    {% set p = task[5] %}
                    <span class="priority-badge
                        {% if p == 'High' %}priority-high
                        {% elif p == 'Medium' %}priority-medium
                        {% elif p == 'Low' %}priority-low
                        {% else %}priority-other{% endif %}">
                        {{ p or 'Not set' }}
                    </span>
                </div>

                <hr class="mb-4">

                <!-- Subject -->
                <div class="mb-4">
                    <div class="form-label fw-semibold">
                        <i class="bi bi-book me-2"></i>
                        Subject
                    </div>
                    <div>{{ task[2] }}</div>
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <div class="form-label fw-semibold">
                        <i class="bi bi-card-text me-2"></i>
                        Description
                    </div>
                    <div style="white-space: pre-wrap;">{{ task[3] or 'No description provided.' }}</div>
                </div>

                <!-- Deadline -->
                <div class="mb-4">
                    <div class="form-label fw-semibold">
                        <i class="bi bi-calendar-event me-2"></i>
                        Deadline
                    </div>
                    <div>{{ task[4] or 'No deadline set.' }}</div>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-end gap-2 pt-3 border-top">

                    <a href="{{ url_for('tasks.index') }}"
                       class="btn btn-secondary">
                        Back
                    </a>

                    <a href="{{ url_for('tasks.edit', task_id=task[0]) }}"
                       class="btn btn-primary">
                        <i class="bi bi-pencil-square me-1"></i>
                        Edit Task
                    </a>

                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
