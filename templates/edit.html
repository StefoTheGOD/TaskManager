<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - TaskManager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 700px;">

    <h1 class="mb-4">Edit Task</h1>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST"
                  action="{{ url_for('tasks.edit', task_id=task[0]) }}">

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" name="title"
                           class="form-control"
                           value="{{ task[1] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" name="subject"
                           class="form-control"
                           value="{{ task[2] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description"
                              class="form-control"
                              rows="3">{{ task[3] or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Deadline</label>
                    <input type="date" name="deadline"
                           class="form-control"
                           value="{{ task[4] or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select name="priority" class="form-select" required>
                        <option value="Low"
                                {% if task[5] == 'Low' %}selected{% endif %}>
                            Low
                        </option>

                        <option value="Medium"
                                {% if task[5] == 'Medium' %}selected{% endif %}>
                            Medium
                        </option>

                        <option value="High"
                                {% if task[5] == 'High' %}selected{% endif %}>
                            High
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="{{ url_for('tasks.index') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
