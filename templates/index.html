<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager - My Tasks</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>My Tasks</h1>

        <a href="{{ url_for('tasks.create') }}" class="btn btn-primary">
            + Add Task
        </a>
    </div>
    <form method="GET" action="{{ url_for('tasks.index') }}"
      class="row g-3 mb-4">

    <div class="col-md-5">
        <input type="text"
               name="subject"
               class="form-control"
               placeholder="Search by subject"
               value="{{ subject }}">
    </div>

    <div class="col-md-4">
        <select name="priority" class="form-select">
            <option value="">All Priorities</option>
            <option value="Low" {% if priority == 'Low' %}selected{% endif %}>
                Low
            </option>
            <option value="Medium" {% if priority == 'Medium' %}selected{% endif %}>
                Medium
            </option>
            <option value="High" {% if priority == 'High' %}selected{% endif %}>
                High
            </option>
        </select>
    </div>

    <div class="col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            Search
        </button>

        <a href="{{ url_for('tasks.index') }}"
           class="btn btn-secondary">
            Reset
        </a>
    </div>

</form>







    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Subject</th>
                        <th>Deadline</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for task in tasks %}
                    <tr>
                        <td>{{ task[0] }}</td>
                        <td>{{ task[1] }}</td>
                        <td>{{ task[2] }}</td>
                        <td>{{ task[4] }}</td>
                        <td>{{ task[5] }}</td>

                        <td>
                            <a href="{{ url_for('tasks.edit', task_id=task[0]) }}"
                               class="btn btn-warning btn-sm">
                                Edit
                            </a>

                            <a href="{{ url_for('tasks.delete', task_id=task[0]) }}"
                               class="btn btn-danger btn-sm">
                                Delete
                            </a>
                        </td>
                    </tr>

                    {% else %}
                    <tr>
                        <td colspan="6" class="text-center text-muted">
                            No tasks found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
